{% extends "base.html" %}

{% block title %}Create Account — KDL{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-shell">

        <div class="text-center mb-4">

            <span class="brand-mark large">
                K
            </span>

            <h2 class="mt-3 mb-2">
                Create your account
            </h2>

            <p class="text-muted mb-0">
                Register as a KDL library patron.
            </p>

        </div>


        <form method="post">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control form-control-lg"
                    placeholder="e.g. Adewale Ayodeji"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Matric / Student Number
                </label>

                <input
                    type="text"
                    name="user_code"
                    class="form-control form-control-lg"
                    placeholder="e.g. E054579"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control form-control-lg"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Department
                </label>

                <input
                    type="text"
                    name="department"
                    class="form-control form-control-lg"
                    placeholder="e.g. Computer Science"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control form-control-lg"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control form-control-lg"
                    placeholder="Repeat your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-lg w-100 mt-2"
            >
                Create Account
            </button>

        </form>


        <div class="auth-register mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </div>

    </div>

</div>

{% endblock %}
