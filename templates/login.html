{% extends "base.html" %}

{% block title %}Sign in — KDL{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-shell">

        <!-- BRAND -->
        <div class="text-center mb-4">

            <span class="brand-mark large">
                K
            </span>

            <h2 class="mt-3 mb-2">
                Welcome back
            </h2>

            <p class="text-muted mb-0">
                Sign in to your KDL library account.
            </p>

        </div>


        <!-- LOGIN FORM -->
        <form method="post">

            <div class="mb-3">

                <label class="form-label">
                    Matric / Staff Number
                </label>

                <input
                    name="user_code"
                    class="form-control form-control-lg"
                    placeholder="e.g. E054579"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    name="password"
                    type="password"
                    class="form-control form-control-lg"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-lg w-100 mt-2"
            >
                Sign in
            </button>

        </form>


        <!-- REGISTER -->
        <div class="auth-register mt-4">

            <span class="text-muted">
                Don't have a patron account?
            </span>

            <a href="{{ url_for('register') }}">
                Create an account
            </a>

        </div>


        <!-- DEMO ACCESS -->
        <div class="demo-box mt-4">

            <div class="demo-title">
                Demo accounts
            </div>

            <div class="demo-row">
                <span>Patron</span>
                <code>E054579 / password</code>
            </div>

            <div class="demo-row">
                <span>Officer</span>
                <code>OFF001 / password</code>
            </div>

            <div class="demo-row">
                <span>Admin</span>
                <code>ADM001 / password</code>
            </div>

        </div>

    </div>

</div>

{% endblock %}
